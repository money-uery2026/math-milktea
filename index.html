<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="数学奶茶屋">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C9B1D0">
<meta name="description" content="小星球的数学奶茶屋 - 学生和老师的互动学习平台">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23C9B1D0'/><text x='50' y='65' font-size='60' text-anchor='middle' fill='white'>🧋</text></svg>">
<title>🌟 小星球的数学奶茶屋</title>
<style>
:root{
  --bg:#F5F0EB;--card:#FFFFFF;--main:#C9B1D0;--main-d:#B89EC4;
  --accent:#FFB7A1;--yellow:#FFE4B5;--text:#4A3A4A;--text-sub:#8A7A8A;
  --shadow:0 2px 12px rgba(0,0,0,0.08);--r:16px;--rc:20px;--rb:25px;
  --green:#A8D8B9;--green-bg:#E8F5EC;--purple-bg:#EFE6F2;--gold-bg:#FFF4DC;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
#app{max-width:420px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg);}
/* PWA standalone mode - remove browser chrome */
@media all and (display-mode: standalone), (display-mode: fullscreen) {
  body { padding-top: 0; padding-bottom: 0; }
  #app { min-height: 100vh; }
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:15px;outline:none;}
.icon{width:22px;height:22px;flex-shrink:0;display:inline-block;vertical-align:middle;}
.icon-sm{width:18px;height:18px;}
.icon-lg{width:28px;height:28px;}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:rgba(245,240,235,0.92);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(201,177,208,0.2);
}
.topbar .title{font-weight:700;font-size:16px;color:var(--text);flex:1;text-align:center;padding:0 8px;}
.topbar .date{font-size:12px;color:var(--text-sub);}
.menu-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.menu-btn:active{background:rgba(201,177,208,0.2);}

/* Sidebar */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;opacity:0;visibility:hidden;transition:all .3s;}
.overlay.open{opacity:1;visibility:visible;}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:85%;max-width:300px;background:#fff;z-index:201;
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,0.12);
}
.sidebar.open{transform:translateX(0);}
.sidebar-head{padding:24px 20px 18px;background:linear-gradient(135deg,var(--main),var(--main-d));color:#fff;}
.sidebar-head .avatar{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.sidebar-head .avatar svg{width:34px;height:34px;}
.sidebar-head .name{font-size:18px;font-weight:700;}
.sidebar-head .sub{font-size:12px;opacity:0.92;margin-top:3px;}
.sidebar-body{flex:1;overflow-y:auto;padding:12px 0;}
.menu-section{padding:8px 0;}
.menu-section-title{font-size:11px;color:var(--text-sub);padding:8px 22px 4px;font-weight:600;letter-spacing:1px;}
.menu-item{display:flex;align-items:center;gap:12px;padding:11px 22px;font-size:14px;color:var(--text);transition:all .15s;}
.menu-item:active{background:rgba(201,177,208,0.12);}
.menu-item.active{background:var(--main);color:#fff;font-weight:600;}
.menu-item.active svg{stroke:#fff;}
.sidebar-foot{padding:14px 22px;font-size:11px;color:var(--text-sub);border-top:1px solid #f0eaef;}

/* Page container */
.page{display:none;padding:12px;padding-bottom:30px;animation:fadeIn .25s;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* Card */
.card{background:var(--card);border-radius:var(--rc);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.section-label{font-size:12px;color:var(--text-sub);margin:14px 4px 8px;font-weight:600;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--rb);
  font-size:15px;font-weight:600;transition:transform .12s;}
.btn:active{transform:scale(0.96);}
.btn-main{background:var(--main);color:#fff;}
.btn-main:active{background:var(--main-d);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-block{width:100%;}
.btn-outline{border:1.5px solid var(--main);color:var(--main);background:#fff;}
.btn-sm{padding:7px 14px;font-size:13px;}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

/* Progress bar */
.bar{height:10px;background:#EFE7EE;border-radius:6px;overflow:hidden;}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--accent));border-radius:6px;transition:width .5s;}

/* Tea cup card */
.tea-card{background:linear-gradient(135deg,var(--main) 0%,var(--yellow) 100%);color:#fff;border-radius:var(--rc);
  padding:18px;box-shadow:var(--shadow);margin-bottom:12px;}
.tea-card .tt{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;font-size:16px;}
.tea-card .prog{font-size:22px;font-weight:800;margin:8px 0 6px;}
.tea-card .hint{font-size:12px;opacity:0.95;}
.tea-card .marsh{margin-top:10px;font-size:13px;background:rgba(255,255,255,0.22);padding:6px 10px;border-radius:10px;display:inline-block;}
.tea-card .bar{background:rgba(255,255,255,0.35);}

/* Snapshot */
.snap{display:flex;gap:12px;}
.snap .item{flex:1;text-align:center;background:var(--purple-bg);border-radius:14px;padding:12px 8px;}
.snap .item .num{font-size:18px;font-weight:700;color:var(--main-d);}
.snap .item .lbl{font-size:11px;color:var(--text-sub);margin-top:3px;}

/* Feature cards grid */
.feat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;background:#fff;border-radius:var(--rc);box-shadow:var(--shadow);font-size:13px;font-weight:600;}
.feat:active{transform:scale(0.97);}
.feat .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.feat .ic svg{width:26px;height:26px;}

/* Task list */
.task{display:flex;align-items:flex-start;gap:10px;padding:10px;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow);}
.cbx{width:22px;height:22px;border:2px solid var(--main);border-radius:6px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cbx.done{background:var(--main);border-color:var(--main);}
.cbx.done svg{display:block;}
.cbx svg{display:none;width:14px;height:14px;}
.task.done .txt{text-decoration:line-through;color:var(--text-sub);}

/* Missions */
.layer{border-radius:var(--rc);overflow:hidden;margin-bottom:12px;}
.layer-head{padding:12px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
.layer-body{padding:8px 10px 12px;}
.q{background:rgba(255,255,255,0.7);border-radius:10px;padding:10px;margin-bottom:8px;}
.q .qhead{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;}
.q .src{font-size:11px;color:var(--text-sub);}
.q .kp{font-size:11px;color:var(--main-d);font-weight:600;}
.q .ct{font-size:13px;}
.collapse{cursor:pointer;}

/* Toast */
#toast{position:fixed;top:0;left:50%;transform:translate(-50%,-100%);background:rgba(74,58,74,0.95);color:#fff;
  padding:12px 22px;border-radius:0 0 16px 16px;z-index:500;font-size:14px;max-width:420px;width:100%;
  text-align:center;transition:transform .3s;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
#toast.show{transform:translate(-50%,0);}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:400;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:var(--rc);padding:22px;width:100%;max-width:320px;}
.modal h3{font-size:17px;margin-bottom:14px;text-align:center;}
.input{width:100%;padding:12px 14px;border:1.5px solid #E8E0E8;border-radius:12px;font-size:15px;margin-bottom:10px;background:#FAF8FA;}
.input:focus{border-color:var(--main);}

/* Upload */
.upload{border:2px dashed var(--main);border-radius:14px;height:160px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--main-d);background:var(--purple-bg);}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:#f0f0f0;}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb .del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;}

/* Quiz */
.opt{background:#fff;border:1.5px solid #E8E0E8;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;transition:all .15s;}
.opt:active{transform:scale(0.98);}
.opt.correct{background:#E8F5EC;border-color:var(--green);}
.opt.wrong{background:#FDECEC;border-color:#F5A0A0;}
.opt.sel{border-color:var(--main);background:var(--purple-bg);}
.opt .letter{width:26px;height:26px;border-radius:50%;background:var(--purple-bg);color:var(--main-d);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}

/* Levels */
.lvl{background:#fff;border-radius:var(--rc);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;}
.lvl.locked{opacity:0.55;}
.lvl .info .ln{font-weight:700;font-size:14px;}
.lvl .info .ld{font-size:11px;color:var(--text-sub);margin-top:3px;}
.lvl .reward{background:var(--gold-bg);color:#B8860B;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:600;}
.lvl .lock-ic{width:28px;height:28px;}

/* Badges */
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;background:#fff;border-radius:14px;box-shadow:var(--shadow);}
.badge .bi{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;}
.badge.locked .bi{filter:grayscale(1);opacity:0.4;background:#f0f0f0;}
.badge .bn{font-size:11px;text-align:center;font-weight:600;}
.badge .bd{font-size:10px;color:var(--text-sub);}

/* Chat */
.chat{padding:6px 0 90px;}
.msg{max-width:75%;padding:10px 13px;border-radius:14px;margin-bottom:10px;font-size:14px;word-break:break-word;}
.msg.me{margin-left:auto;background:var(--main);color:#fff;border-bottom-right-radius:4px;}
.msg.t{margin-right:auto;background:#F0F0F0;color:var(--text);border-bottom-left-radius:4px;}
.msg .t{font-size:10px;opacity:0.7;margin-top:4px;display:block;}
.chat-input{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;
  background:#fff;padding:10px 12px;display:flex;gap:8px;border-top:1px solid #eee;z-index:50;}
.chat-input textarea{flex:1;border:1.5px solid #E8E0E8;border-radius:20px;padding:10px 14px;resize:none;height:44px;max-height:80px;}

/* Bars chart */
.kbar{margin-bottom:12px;}
.kbar .kl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.kbar .bar{height:12px;}

/* Tab */
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow);}
.tab{flex:1;text-align:center;padding:9px;font-size:13px;border-radius:10px;font-weight:600;color:var(--text-sub);}
.tab.active{background:var(--main);color:#fff;}

/* Log */
.log{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow);}
.log .lt{font-size:12px;color:var(--text-sub);margin-top:2px;}
.log .lv{font-weight:700;font-size:15px;}
.log .lv.plus{color:var(--main-d);}
.log .lv.minus{color:#D08A8A;}

/* Confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:600;overflow:hidden;}

/* Float anim */
@keyframes pop{0%{transform:scale(0.5);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
.pop{animation:pop .35s;}

/* Plus float */
@keyframes floatup{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-50px);opacity:0;}}
.float-num{position:fixed;z-index:550;font-weight:800;font-size:20px;color:var(--accent);pointer-events:none;animation:floatup 1s forwards;}

.muted{color:var(--text-sub);}
.text-sm{font-size:13px;}
.text-xs{font-size:11px;}
.flex{display:flex;}
.between{justify-content:space-between;}
.center{align-items:center;}
.gap{gap:8px;}
.mt{margin-top:10px;}
.mb{margin-bottom:10px;}
.right{text-align:right;}
.purple-text{color:var(--main-d);}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--purple-bg);color:var(--main-d);font-weight:600;}
.tag-green{background:var(--green-bg);color:#5A9A6E;}
.tag-yellow{background:var(--gold-bg);color:#B8860B;}
.divider{height:1px;background:#eee;margin:12px 0;}
</style>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar(true)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="title" id="pageTitle">🌟 小星球的数学奶茶屋</div>
    <div class="date" id="topDate"></div>
    <button class="menu-btn" onclick="refreshFromStorage()" title="刷新同步">
      <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="var(--text-sub)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
  </div>

  <!-- Sidebar -->
  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M12 14c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z"/></svg>
      </div>
      <div class="name">彦材</div>
      <div class="sub" id="sbSub">初三 · 战力值 78</div>
    </div>
    <div class="sidebar-body" id="sbBody"></div>
    <div class="sidebar-foot">v1.0 · 数据本地存储</div>
  </aside>

  <!-- Pages container -->
  <main id="main"></main>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Modal root -->
  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti"></canvas>
</div>

<script>
/* ============ SVG ICONS ============ */
const SVG={
  home:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  task:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  game:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 12v3M5.5 13.5h3M15 12h.01M18 14h.01"/></svg>',
  chart:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/></svg>',
  note:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>',
  trophy:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0z"/></svg>',
  star:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg>',
  coin:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.5a3 3 0 0 0-3-1.5c-1.66 0-3 1-3 2.5s1.34 2.5 3 2.5 3 1 3 2.5-1.34 2.5-3 2.5a3 3 0 0 1-3-1.5M12 6.5v11"/></svg>',
  lock:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rp(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const QG={

    '直接开平方法':[
      function g1(){
        const a=ri(2,12),b=ri(2,9);
        const q=`方程 x²-${a}=0 的解是（ ）`;

      },

        const opts=shuffle([ans,...wrong.slice(0,3)]);
        return {q,opts,ans:opts.indexOf(ans),parsing:`直接开平方得 x-${a}=±${r}，故 x=${a}±${r}，即 x₁=${x1}, x₂=${x2}`,kp:'直接开平方法',diff:'基础'};

      function g1(){

        const ans=`(x-${half})²=${c}`;
        const wrong=[`(x-${half})²=${c+1}`,`(x-${a})²=${c}`,`(x-${half+1})²=${c}`];
        const opts=shuffle([ans,...wrong.slice(0,3)]);
        return {q,opts,ans:opts.indexOf(ans),parsing:`x²-${a}x = -${b}，配方：x²-${a}x+${half*half} = -${b}+${half*half}，即 (x-${half})²=${c}`,kp:'配方法',diff:'基础'};
      },
      function g2(){
        const a=ri(2,5),b=ri(2,8),c=ri(1,5);
        const left=b/(2*a);
        const right=(c/a)-left*left;
        const q=`用配方法解方程 ${a}x²-${b}x+${c}=0，配方后应为（ ）`;
        const ans=`(x-${left.toFixed(1).replace(/\.0$/,'')})²=${Math.abs(right).toFixed(2).replace(/\.00$/,'').replace(/0$/,'')}`;
        const wrong=[`(x-${(left+0.5).toFixed(1).replace(/\.0$/,'')})²=${Math.abs(right).toFixed(2).replace(/\.00$/,'').replace(/0$/,'')}`,`(x-${left.toFixed(1).replace(/\.0$/,'')})²=${Math.abs(right+1).toFixed(2).replace(/\.00$/,'').replace(/0$/,'')}`,`(x-${(left-0.5).toFixed(1).replace(/\.0$/,'')})²=${Math.abs(right).toFixed(2).replace(/\.00$/,'').replace(/0$/,'')}`];
        const opts=shuffle([ans,...wrong.slice(0,3)]);

        const opts=shuffle([ans,...wrong.slice(0,3)]);
        return {q,opts,ans:opts.indexOf(ans),parsing:`Δ=b²-4ac = (${b})²-4×1×${c} = ${b*b}-${4*c} = ${d}`,kp:'公式法',diff:'基础'};

        return {q,opts,ans:opts.indexOf(ans),parsing:`Δ=(${b})²-4×1×${c}=${d} ${d>0?'>0，故有两个不相等的实数根':d===0?'=0，故有两个相等的实数根':'<0，故无实数根'}`,kp:'公式法',diff:'基础'};

      function g1(){
        const m=ri(2,5),n=ri(2,5);
        const sum=m+n,prod=m*n;

        const ans=`x₁=${m}, x₂=${n}`;
        const wrong=[`x₁=${m+1}, x₂=${n}`,`x₁=${m}, x₂=${n+1}`,`x₁=${sum}, x₂=0`];
        const opts=shuffle([ans,...wrong.slice(0,3)]);
        return {q,opts,ans:opts.indexOf(ans),parsing:`因式分解：(x-${m})(x-${n})=0，故 x=${m} 或 x=${n}`,kp:'因式分解',diff:'基础'};

        const wrong=[`${sum*sum}`,`${target+1}`,`${prod*2}`];

        return {q,opts,ans:opts.indexOf(ans),parsing:`x₁²+x₂²=(x₁+x₂)²-2x₁x₂ = ${sum}²-2×${prod} = ${sum*sum}-${2*prod} = ${target}`,kp:'根与系数',diff:'中档'};
      }
    ],

function generateQuestions(chapter,kps,diff,numPerDiff){
  const result=[];
  const templates=QG[chapter];
  if(!templates)return result;
  kps.forEach(kp=>{
    const pool=templates[kp];
    if(!pool)return;
    pool.forEach(fn=>{
      const q=fn();
      if(diff.includes(q.diff)){
        result.push(q);
      }
    });
  });
  // 如果不够，循环生成直到满足数量
  while(result.length<numPerDiff[0]+numPerDiff[1]+numPerDiff[2]){
    kps.forEach(kp=>{
      const pool=templates[kp];
      if(!pool)return;
      const q=fn=>fn();
      const picked=rp(pool)();
      if(diff.includes(picked.diff)&&result.length<numPerDiff[0]+numPerDiff[1]+numPerDiff[2]){
        result.push(picked);
      }
    });
  }
  // 按难度分组
  const base=result.filter(q=>q.diff==='基础').slice(0,numPerDiff[0]);
  const mid=result.filter(q=>q.diff==='中档').slice(0,numPerDiff[1]);
  const high=result.filter(q=>q.diff==='拔高').slice(0,numPerDiff[2]);
  return {base,mid,high};
}

/* ============ CLOUD SYNC (GitHub Gist - 永久存储，永不过期) ============ */
const GIST_ID='a4619af1dfab3b4a932e0d45bb214ec4';
const GIST_TOKEN='__GIST_TOKEN__';
const GIST_API='https://api.github.com/gists/'+GIST_ID;
const GIST_HEADERS={
  'Authorization':'token '+GIST_TOKEN,
  'Accept':'application/vnd.github+json',
  'Content-Type':'application/json'
};
let _cloudSyncing=false;

async function cloudFetch(){
  try{
    const res=await fetch(GIST_API,{headers:GIST_HEADERS});
    if(!res.ok)return null;
    const gist=await res.json();
    const raw=gist.files&&gist.files['data.json']&&gist.files['data.json'].content;
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null;}
}

async function cloudSave(data){
  try{
    const res=await fetch(GIST_API,{
      method:'PATCH',
      headers:GIST_HEADERS,
      body:JSON.stringify({
        files:{'data.json':{content:JSON.stringify(data)}}
      })
    });
    return res.ok;
  }catch(e){return false;}
}

// 老师发布作业 → 上传到云端
async function cloudPublishHW(homework){
  const cloud=await cloudFetch()||{homeworks:[],submissions:[]};
  if(!cloud.homeworks)cloud.homeworks=[];
  // 去重：同一天替换
  cloud.homeworks=cloud.homeworks.filter(h=>h.date!==homework.date);
  cloud.homeworks.push(homework);
  const ok=await cloudSave(cloud);
  if(ok)toast('☁️ 作业已同步到云端，学生可见');
  else toast('⚠️ 云端同步失败，仅本地保存');
  return ok;
}

// 学生提交作业 → 上传到云端
async function cloudSubmitHW(submission){
  const cloud=await cloudFetch()||{homeworks:[],submissions:[]};
  if(!cloud.submissions)cloud.submissions=[];
  cloud.submissions.push(submission);
  const ok=await cloudSave(cloud);
  if(ok)toast('☁️ 作业已上传，老师可见');
  return ok;
}

// 老师批改 → 更新云端
async function cloudGradeHW(submission_dt,status,feedback,boba){
  const cloud=await cloudFetch()||{homeworks:[],submissions:[]};
  if(!cloud.submissions)cloud.submissions=[];
  const sub=cloud.submissions.find(s=>s.dt===submission_dt);
  if(sub){
    sub.status=status;sub.feedback=feedback;sub.boba=boba;
    await cloudSave(cloud);
  }
  return true;
}

// 从云端拉取数据（学生端获取作业 / 老师端获取提交）
async function cloudPull(){
  if(_cloudSyncing)return;
  _cloudSyncing=true;
  try{
    const cloud=await cloudFetch();
    if(!cloud){_cloudSyncing=false;return;}

    // 学生端：拉取老师发布的作业
    if(cloud.homeworks&&cloud.homeworks.length){
      const latest=cloud.homeworks[cloud.homeworks.length-1];
      if(latest&&(!DB._cloudHwDate||DB._cloudHwDate!==latest.date)){
        DB._cloudHwDate=latest.date;
        if(latest.missions){
          DB.student.missions=latest.missions;
          DB.student.chapter=latest.chapter||DB.student.chapter;
          saveDB();
          toast('📥 收到老师新布置的作业！');
          render();
        }
      }
    }

    // 老师端：拉取学生提交的作业
    if(cloud.submissions&&cloud.submissions.length){
      let newCount=0;
      cloud.submissions.forEach(sub=>{
        if(!DB.teacher.toGrade.find(g=>g.dt===sub.dt)){
          DB.teacher.toGrade.push(sub);
          newCount++;
        }else{
          const existing=DB.teacher.toGrade.find(g=>g.dt===sub.dt);
          if(sub.status&&sub.status!=='pending'&&!existing.statusUpdated){
            existing.status=sub.status;
            existing.feedback=sub.feedback;
            existing.boba=sub.boba;
            existing.statusUpdated=true;
          }
        }
      });
      if(newCount>0){
        saveDB();
        toast('📥 收到'+newCount+'份新作业提交！');
        render();
      }
    }

    // 学生端：拉取批改结果
    if(cloud.submissions&&cloud.submissions.length){
      cloud.submissions.forEach(sub=>{
        if(sub.status==='graded'){
          const existing=DB.student.homeworkHistory.find(h=>h.dt===sub.dt);
          if(!existing||(existing.status!=='graded')){
            if(existing){
              existing.status='graded';
              existing.comment=sub.feedback||'';
            }else{
              DB.student.homeworkHistory.unshift({dt:sub.dt,status:'graded',comment:sub.feedback||''});
            }
            if(sub.boba){
              addBoba(sub.boba,'作业批改','🌟');
            }
            saveDB();
            toast('🎉 作业批改结果已同步！');
            render();
          }
        }
      });
    }
  }catch(e){}
  _cloudSyncing=false;
}

/* ============ CONFETTI ============ */
function confetti(){
  const c=document.getElementById('confetti');c.width=innerWidth;c.height=innerHeight;
  const ctx=c.getContext('2d');const colors=['#C9B1D0','#FFB7A1','#FFE4B5','#A8D8B9','#B89EC4'];
  const ps=[];
  for(let i=0;i<120;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*200,
    r:4+Math.random()*6,col:colors[i%colors.length],vy:2+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6.28,vr:-0.2+Math.random()*0.4});
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);frame++;
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    if(frame<240)requestAnimationFrame(draw);else ctx.clearRect(0,0,c.width,c.height);
  }
  draw();
}

function drawChart(){
  const c=document.getElementById('chart');if(!c)return;
  const ctx=c.getContext('2d');const data=DB.student.accuracy;
  const W=c.width,H=c.height,pad=24;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#eee';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad+i*(H-2*pad)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();
    ctx.fillStyle='#bbb';ctx.font='10px';ctx.fillText((100-i*25)+'%',2,y+3);}
  const wk=['一','二','三','四','五','六','日'];
  ctx.strokeStyle='#C9B1D0';ctx.lineWidth=2;ctx.beginPath();
  data.forEach((v,i)=>{const x=pad+i*(W-2*pad)/6;const y=H-pad-(v/100)*(H-2*pad);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.stroke();
  ctx.fillStyle='#FFB7A1';data.forEach((v,i)=>{const x=pad+i*(W-2*pad)/6;const y=H-pad-(v/100)*(H-2*pad);
    ctx.beginPath();ctx.arc(x,y,4,0,6.28);ctx.fill();
    ctx.fillStyle='#8A7A8A';ctx.font='10px';ctx.fillText(v,x-8,y-8);ctx.fillStyle='#FFB7A1';});
  ctx.fillStyle='#8A7A8A';ctx.font='10px';
  wk.forEach((w,i)=>{const x=pad+i*(W-2*pad)/6;ctx.fillText(w,x-4,H-pad+14);});
}

  const kps=Array.from(checks).map(c=>c.value);
  if(!kps.length){toast('请至少选择一个考点');return;}
  const nBase=+document.getElementById('nBase').value||0;
  const nMid=+document.getElementById('nMid').value||0;
  const nHigh=+document.getElementById('nHigh').value||0;
  if(nBase+nMid+nHigh===0){toast('请至少生成1道题');return;}

  toast('✨ AI正在生成题目...');
  const result=generateQuestions(ch,kps,['基础','中档','拔高'],[nBase,nMid,nHigh]);

  let html='';
  if(result.base.length){
    html+=`<div class="card" style="background:var(--green-bg)"><div class="card-title">🔥 青铜层（${result.base.length}道基础题·必做）</div>`;
    result.base.forEach((q,i)=>{
      html+=`<div class="mb" style="padding:8px;background:#fff;border-radius:8px;margin-bottom:8px">
        <div class="text-sm"><b>${i+1}.</b> ${q.q}</div>
        <div class="text-xs muted mt">${q.opts.map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`).join('  ')}</div>
        <div class="text-xs" style="color:var(--green)">✅ 答案：${String.fromCharCode(65+q.ans)} · ${q.parsing}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  if(result.mid.length){
    html+=`<div class="card" style="background:var(--purple-bg)"><div class="card-title">💪 白银层（${result.mid.length}道中档题·必做）</div>`;
    result.mid.forEach((q,i)=>{
      html+=`<div class="mb" style="padding:8px;background:#fff;border-radius:8px;margin-bottom:8px">
        <div class="text-sm"><b>${i+1}.</b> ${q.q}</div>
        <div class="text-xs muted mt">${q.opts.map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`).join('  ')}</div>
        <div class="text-xs" style="color:var(--green)">✅ 答案：${String.fromCharCode(65+q.ans)} · ${q.parsing}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  if(result.high.length){
    html+=`<div class="card" style="background:var(--gold-bg)"><div class="card-title">👑 黄金层（${result.high.length}道拔高题·选做）</div>`;
    result.high.forEach((q,i)=>{
      html+=`<div class="mb" style="padding:8px;background:#fff;border-radius:8px;margin-bottom:8px">
        <div class="text-sm"><b>${i+1}.</b> ${q.q}</div>
        <div class="text-xs muted mt">${q.opts.map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`).join('  ')}</div>
        <div class="text-xs" style="color:var(--green)">✅ 答案：${String.fromCharCode(65+q.ans)} · ${q.parsing}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('previewBox').innerHTML=html;
  _generatedHW=result;
  document.getElementById('publishBtn').style.display='block';
  toast('✅ 题目生成完成！');
}

function publishHW(){
  if(!_generatedHW){toast('请先生成题目');return;}
  const ch=document.getElementById('achapter').value;
  const hwDate=document.getElementById('adate').value||new Date().toISOString().slice(0,10);
  DB.student.chapter=ch;
  // 将生成的题目写入missions
  DB.student.missions.bronze=_generatedHW.base.map(q=>({done:false,src:'[AI生成·'+q.kp+']',q:q.q+'<br><small class="muted">'+q.opts.map((o,j)=>String.fromCharCode(65+j)+'. '+o).join(' ')+'</small>',kp:q.kp,ans:String.fromCharCode(65+q.ans),parsing:q.parsing}));
  DB.student.missions.silver=_generatedHW.mid.map(q=>({done:false,src:'[AI生成·'+q.kp+']',q:q.q+'<br><small class="muted">'+q.opts.map((o,j)=>String.fromCharCode(65+j)+'. '+o).join(' ')+'</small>',kp:q.kp,ans:String.fromCharCode(65+q.ans),parsing:q.parsing}));
  DB.student.missions.gold=_generatedHW.high.map(q=>({done:false,src:'[AI生成·'+q.kp+']',q:q.q+'<br><small class="muted">'+q.opts.map((o,j)=>String.fromCharCode(65+j)+'. '+o).join(' ')+'</small>',kp:q.kp,ans:String.fromCharCode(65+q.ans),parsing:q.parsing}));
  saveDB();
  // 上传到云端，让学生端也能收到
  cloudPublishHW({
    date:hwDate,
    chapter:ch,
    missions:JSON.parse(JSON.stringify(DB.student.missions))
  });
  toast('✅ 作业已发布！正在同步到学生端...');navigate('thome');
}

function doBatch(){

/* ============ MODAL ============ */
function openModal(html,wide){
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalContent').style.maxWidth=wide?'380px':'320px';
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}

/* ============ INIT ============ */
function init(){
  loadDB();recomputePower();
  document.getElementById('topDate').textContent=todayStr();
  renderSidebar();
  if(!DB.currentPage||!PAGES[DB.currentPage])DB.currentPage='home';
  if(DB.currentPage.startsWith('t')&&DB.currentPage!=='thome'&&!DB.teacher.loggedIn&&DB.currentPage!=='teacherLogin'){DB.currentPage='home';}
  navigate(DB.currentPage);
  // cross-tab sync: BroadcastChannel
  try{
    _syncChannel=new BroadcastChannel('mathmilktea_sync');
    _syncChannel.onmessage=function(ev){if(ev.data&&ev.data.type==='sync')_onSyncMessage();};
  }catch(e){}
  // cross-tab sync: storage event (fallback + same-origin)
  window.addEventListener('storage',function(ev){
    if(ev.key===KEY)_onSyncMessage();
  });
  // polling sync: check localStorage every 3s
  setInterval(function(){
    const raw=localStorage.getItem(KEY);
    if(!raw)return;
    const cur=JSON.stringify(DB);
    if(raw!==cur){
      try{
        const parsed=JSON.parse(raw);
        parsed.currentPage=DB.currentPage;
        parsed.sidebarOpen=DB.sidebarOpen;
        parsed.teacher.loggedIn=DB.teacher.loggedIn;
        DB=parsed;
        render();renderSidebar();
      }catch(e){}
    }
  },3000);
  // cloud sync: poll server every 10s for cross-device data
  cloudPull();
  setInterval(cloudPull,10000);
}
init();
// Register Service Worker for PWA
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){
      console.log('SW registration failed:',err);
    });
  });
}
